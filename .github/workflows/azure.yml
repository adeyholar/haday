# Manual Azure deploy. Add GitHub secrets, then Run workflow.
# AZURE_WEBAPP_NAME — App Service name (e.g. haday)
# AZURE_WEBAPP_PUBLISH_PROFILE — Get publish profile from Azure Portal
name: Deploy Azure

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "image=ghcr.io/${{ github.repository_owner }}/haday:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository_owner }}/haday:latest

      - uses: azure/webapps-deploy@v3
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ steps.meta.outputs.image }}
