# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - haday

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: hadayjemacr-g0e6f4axe0fgdxfj.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_E97B94A5850F4327B110DF13D00FEDBC }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_48338A95D9E9449D9C74E2AF569EA7CF }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: hadayjemacr-g0e6f4axe0fgdxfj.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_E97B94A5850F4327B110DF13D00FEDBC }}/haday:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'haday'
          slot-name: 'Production'
          images: 'hadayjemacr-g0e6f4axe0fgdxfj.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_E97B94A5850F4327B110DF13D00FEDBC }}/haday:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F3C5C14A808240C9BF4A988753E688D0 }}